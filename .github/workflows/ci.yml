name: Mapping foundation checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - run: npm test
      - run: npm run fixtures:check
      - run: npm run validate -- tests/fixtures/street-square.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run browser:release
        env:
          MAP_LITERACY_PORTABLE_CHROMIUM: '1'
  elevation-preparation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: python3 -m venv .elevation-venv
      - run: .elevation-venv/bin/pip install -r tools/elevation/requirements.txt
      - run: .elevation-venv/bin/python -m unittest discover -s tools/elevation -p 'test_*.py' -v
